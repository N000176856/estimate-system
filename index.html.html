<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cooling Tower 報價估算表</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: #F0F5FF;
    color: #1a1a1a;
    padding: 20px 16px;
  }
  .page {
    max-width: 1100px;
    margin: 0 auto;
  }

  /* 標題 */
  .header {
    background: linear-gradient(135deg, #1E3A5F, #2563EB);
    color: #fff;
    padding: 32px 40px 24px;
    border-radius: 16px 16px 0 0;
    text-align: center;
  }
  .header h1 { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  .header h1::before { content: '⚙️ '; }
  .header p { font-size: 15px; opacity: 0.85; margin-top: 6px; }

  /* 控制面板 */
  .ctrl-panel {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    padding: 28px 36px;
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  .ctrl-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #3B82F6;
    margin-bottom: 8px;
  }
  .ctrl-group input {
    width: 100%;
    padding: 10px 14px;
    font-size: 22px;
    font-weight: 700;
    border: 1.5px solid #d0dbe6;
    border-radius: 8px;
    font-family: inherit;
    color: #1E40AF;
    transition: border-color 0.2s;
  }
  .ctrl-group input:focus {
    outline: none;
    border-color: #2563EB;
    box-shadow: 0 0 0 3px rgba(42,100,150,0.12);
  }
  .ctrl-group .hint {
    font-size: 12px;
    color: #64748B;
    margin-top: 6px;
  }

  /* 摘要卡片 */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-top: 20px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    padding: 20px 24px;
    border-left: 4px solid #2563EB;
  }
  .card .lbl { font-size: 13px; color: #3B82F6; margin-bottom: 6px; }
  .card .val { font-size: 22px; font-weight: 700; color: #1E40AF; }
  .card .sub { font-size: 12px; color: #64748B; margin-top: 4px; }
  .card.profit { border-left-color: #F59E0B; }
  .card.profit .val { color: #b8860b; }
  .card.rate { border-left-color: #22C55E; }
  .card.rate .val { color: #2a8a88; }

  /* 圖表區 */
  .chart-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 20px;
  }
  .chart-box {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    padding: 20px 24px;
  }
  .chart-box h3 {
    font-size: 15px;
    font-weight: 600;
    color: #1E40AF;
    margin-bottom: 12px;
  }
  .chart-box h3::before { content: '📊 '; }
  canvas { width: 100% !important; }

  /* 明細表 */
  .detail-section {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    padding: 24px 28px;
    margin-top: 20px;
    overflow-x: auto;
  }
  .detail-section h3 {
    font-size: 16px;
    font-weight: 700;
    color: #1E40AF;
    margin-bottom: 16px;
  }
  .detail-section h3::before { content: '📋 '; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  th {
    background: #1E40AF;
    color: #fff;
    padding: 10px 12px;
    text-align: center;
    font-weight: 500;
    font-size: 13px;
    position: sticky; top: 0;
  }
  td {
    padding: 7px 12px;
    border-bottom: 1px solid #e8ecf1;
    vertical-align: middle;
  }
  tr.cat-header td {
    background: #EFF6FF;
    font-weight: 700;
    border-bottom: 2px solid #93C5FD;
    font-size: 14px;
  }
  tr.cat-header td.cat-note {
    font-weight: 400;
    font-size: 12.5px;
    color: #3B82F6;
  }
  tr.subtotal td {
    background: #FEF9C3;
    font-weight: 700;
    border-top: 1.5px solid #EAB308;
    border-bottom: 2px solid #EAB308;
  }
  tr.subtotal td.sub-note {
    font-weight: 400;
    color: #A16207;
    font-size: 12.5px;
  }
  tr.grand td {
    background: #FEF9C3;
    font-weight: 700;
    font-size: 14px;
    border-top: 2.5px solid #CA8A04;
    border-bottom: 2.5px solid #CA8A04;
  }
  tr.data-row:hover td { background: #EFF6FF; }
  .al { text-align: left; }
  .ar { text-align: right; font-variant-numeric: tabular-nums; }
  .ac { text-align: center; }

  /* 佔比條 */
  .pct-bar-bg {
    width: 80px; height: 8px;
    background: #e8ecf1;
    border-radius: 4px;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
  }
  .pct-bar {
    height: 100%;
    border-radius: 4px;
    background: #2a6496;
  }

  @media (max-width: 800px) {
    .ctrl-panel { grid-template-columns: 1fr; }
    .summary { grid-template-columns: repeat(2, 1fr); }
    .chart-section { grid-template-columns: 1fr; }
    .detail-section { padding: 16px 12px; }
  }
  @media (max-width: 500px) {
    .summary { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="page">
<div class="header">
<h1>Cooling Tower 報價估算表</h1>
<p>台塑冷卻水塔檢修工程 — 內部用</p>
<p style="font-size:12px; color:#94a3b8; margin-top:4px; letter-spacing:0.5px;">林家弘製作</p>
</div>
<div class="ctrl-panel">
<div class="ctrl-group">
<label>美金匯率 (USD → TWD)</label>
<input id="inputRate" min="1" step="0.1" type="number" value="32"/>
<div class="hint">調整匯率後全部自動重算</div>
</div>
<div class="ctrl-group">
<label>報價金額 (NT$)</label>
<input id="inputQuote" inputmode="numeric" placeholder="請輸入金額" type="text" value=""/>
<div class="hint">可自行設定報價金額</div>
</div>
<div class="ctrl-group">
<label>預計毛利率 (%)</label>
<input id="inputMargin" max="100" min="0" step="0.1" type="number" value="11.9"/>
<div class="hint">計算公式：成本 = 報價 × (1 - 毛利率)</div>
</div>
</div>
<div style="text-align:right; padding:8px 36px 0;">
<button class="export-btn" onclick="exportExcel()" onmouseout="this.style.transform='';this.style.boxShadow='0 2px 8px rgba(34,197,94,0.3)';" onmouseover="this.style.transform='translateY(-1px)';this.style.boxShadow='0 4px 14px rgba(34,197,94,0.4)';" style="
    background: linear-gradient(135deg, #22C55E, #16A34A);
    color: #fff; border: none; border-radius: 8px;
    padding: 10px 28px; font-size: 14px; font-weight: 600;
    cursor: pointer; box-shadow: 0 2px 8px rgba(34,197,94,0.3);
    font-family: inherit; letter-spacing: 0.5px;
    transition: transform 0.15s, box-shadow 0.15s;
  ">
    ⬇ 匯出 Excel
  </button>
</div>
<div class="summary">
<div class="card">
<div class="lbl">總成本</div>
<div class="val" id="sCost">-</div>
<div class="sub" id="sCostUsd"></div>
</div>
<div class="card">
<div class="lbl">報價金額</div>
<div class="val" id="sQuote">-</div>
<div class="sub">可在控制面板調整</div>
</div>
<div class="card profit">
<div class="lbl">毛利金額</div>
<div class="val" id="sProfit">-</div>
<div class="sub" id="sProfitPct"></div>
</div>
<div class="card rate">
<div class="lbl">毛利率</div>
<div class="val" id="sMargin">-</div>
<div class="sub">報價 - 成本 = 毛利</div>
</div>
</div>
<div class="chart-section">
<div class="chart-box"><h3>各類成本佔比</h3><canvas id="pieChart"></canvas></div>
<div class="chart-box"><h3>各類成本金額比較</h3><canvas id="barChart"></canvas></div>
</div>
<div class="detail-section">
<h3>成本明細表</h3>
<table>
<thead>
<tr>
<th style="width:40px"></th>
<th class="al" style="min-width:170px">專案</th>
<th class="ar" style="min-width:120px">預算</th>
<th class="al" style="min-width:200px">說明</th>
<th class="ar" style="min-width:80px">佔比</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3/dist/jszip.min.js"></script>

async function exportExcel() {
  var btn = document.querySelector('.export-btn');
  if (!btn) { alert('找不到按鈕'); return; }
  var origText = btn.textContent;
  btn.textContent = '產生中...';
  btn.disabled = true;

  try {
    // 檢查 JSZip
    if (typeof JSZip === 'undefined') {
      throw new Error('JSZip 未載入，請檢查網路連線');
    }

    // 解壓原始 Excel
    var raw = Uint8Array.from(atob(EXCEL_B64), function(c) { return c.charCodeAt(0); });
    var zip = await JSZip.loadAsync(raw);

    // 取得網頁上的參數
    var rate = parseFloat(document.getElementById('inputRate').value) || 32;
    var quote = parseNum(document.getElementById('inputQuote').value) || 0;
    var marginPct = parseFloat(document.getElementById('inputMargin').value) || 11.9;
    var marginDecimal = marginPct / 100;

    // 修改 sheet1.xml
    var sheetXml = await zip.file('xl/worksheets/sheet1.xml').async('string');

    // 修改 I3 (匯率)
    sheetXml = sheetXml.replace(
      /<c r="I3"([^>]*)><v>[^<]*<\/v><\/c>/,
      '<c r="I3"$1><v>' + rate + '</v></c>'
    );
    // 修改 D43 (報價金額)
    sheetXml = sheetXml.replace(
      /<c r="D43"([^>]*)><v>[^<]*<\/v><\/c>/,
      '<c r="D43"$1><v>' + quote + '</v></c>'
    );
    // 修改 D44 (毛利率)
    sheetXml = sheetXml.replace(
      /<c r="D44"([^>]*)><v>[^<]*<\/v><\/c>/,
      '<c r="D44"$1><v>' + marginDecimal + '</v></c>'
    );

    zip.file('xl/worksheets/sheet1.xml', sheetXml);

    // 修改 sharedStrings.xml 中的匯率換算文字
    var ssXml = await zip.file('xl/sharedStrings.xml').async('string');
    ssXml = ssXml.replace(
      /匯率換算[^<]*/,
      '匯率換算　 1:' + rate
    );
    zip.file('xl/sharedStrings.xml', ssXml);

    // 產生並下載
    var blob = await zip.generateAsync({
      type: 'blob',
      mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
    });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '冷卻水塔估算表.xlsx';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function() {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1000);

  } catch(e) {
    alert('匯出失敗: ' + e.message);
    console.error(e);
  } finally {
    btn.textContent = origText;
    btn.disabled = false;
  }
}

        + '<td class="al" style="padding-left:30px">' + item.name + '</td>'
        + '<td class="ar">' + budgetStr + '</td>'
        + '<td class="al">' + item.desc + '</td>'
        + '<td class="ar" style="font-size:12px">' + pctCell + '</td>';
      tbody.appendChild(tr);
    });

    // 外購: 額外顯示 USD 小計 + NT 小計
    if (sec.isUsd) {
      let usdRow = document.createElement("tr");
      usdRow.className = "data-row";
      usdRow.innerHTML = '<td></td>'
        + '<td class="al" style="padding-left:30px;font-weight:600">外購金額</td>'
        + '<td class="ar" style="font-weight:600">US$' + fmt(secUsd) + '</td>'
        + '<td></td><td></td>';
      tbody.appendChild(usdRow);

      let subtr = document.createElement("tr");
      subtr.className = "subtotal";
      const pctSum = sec.items.reduce((a, b) => a + b.pct, 0);
      subtr.innerHTML = '<td></td>'
        + '<td class="al" style="padding-left:30px">小計-台幣</td>'
        + '<td class="ar">' + fmt(secNT) + '</td>'
        + '<td class="sub-note">匯率換算 1:' + rate + '　　' + sec.subtotalNote + '</td>'
        + '<td class="ar" style="font-size:12px">' + pctSum.toFixed(2) + '%</td>';
      tbody.appendChild(subtr);
    } else if (sec.items.length > 1 || sec.subtotalNote) {
      let subtr = document.createElement("tr");
      subtr.className = "subtotal";
      const pctSum = sec.items.reduce((a, b) => a + b.pct, 0);
      subtr.innerHTML = '<td></td>'
        + '<td class="al" style="padding-left:30px">小計-台幣</td>'
        + '<td class="ar">' + fmt(secNT) + '</td>'
        + '<td class="sub-note">' + sec.subtotalNote + '</td>'
        + '<td class="ar" style="font-size:12px">' + pctSum.toFixed(2) + '%</td>';
      tbody.appendChild(subtr);
    }

    secTotals.push(secNT);
  });

  // 空行
  let emR = document.createElement("tr");
  emR.innerHTML = '<td colspan="5" style="height:6px;border:none"></td>';
  tbody.appendChild(emR);

  // 總計
  let gr1 = document.createElement("tr"); gr1.className = "grand";
  gr1.innerHTML = '<td></td><td class="al">總計</td><td class="ar">' + fmt(totalCost) + '</td><td></td><td class="ar">100%</td>';
  tbody.appendChild(gr1);

  let gr2 = document.createElement("tr"); gr2.className = "grand";
  gr2.innerHTML = '<td></td><td class="al">報價金額</td><td class="ar">' + fmt(quote) + '</td><td></td><td></td>';
  tbody.appendChild(gr2);

  let gr3 = document.createElement("tr"); gr3.className = "grand";
  gr3.innerHTML = '<td></td><td class="al">預計毛利(受訂後)</td><td class="ar">' + marginPct.toFixed(1) + '%</td><td></td><td></td>';
  tbody.appendChild(gr3);

  // ===== 圖表 =====
  if (pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById("pieChart"), {
    type: "doughnut",
    data: {
      labels: SEC_LABELS,
      datasets: [{ data: secTotals, backgroundColor: COLORS, borderWidth: 2, borderColor: "#fff" }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: "bottom", labels: { font: { size: 12 }, padding: 14 } },
        tooltip: { callbacks: { label: ctx => ctx.label + ": NT$ " + fmt(ctx.parsed) + " (" + (ctx.parsed / totalCost * 100).toFixed(1) + "%)" } }
      }
    }
  });

  if (barChart) barChart.destroy();
  barChart = new Chart(document.getElementById("barChart"), {
    type: "bar",
    data: {
      labels: SEC_LABELS,
      datasets: [{ data: secTotals, backgroundColor: COLORS, borderRadius: 4 }]
    },
    options: {
      indexAxis: "y",
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => "NT$ " + fmt(ctx.parsed.x) } }
      },
      scales: {
        x: { ticks: { callback: v => (v / 1e6).toFixed(0) + "M" } }
      }
    }
  });
}

// 報價金額即時千分位格式化（輸入時即時顯示）
const quoteInput = document.getElementById('inputQuote');
quoteInput.addEventListener('input', function() {
  // 記住游標位置
  const cursorPos = this.selectionStart;
  const oldLen = this.value.length;
  // 只保留數字
  const raw = this.value.replace(/[^0-9]/g, '');
  const num = parseInt(raw, 10);
  if (!isNaN(num)) {
    this.value = num.toLocaleString('en-US');
  } else {
    this.value = '';
  }
  // 調整游標位置（因逗號數量變化）
  const newLen = this.value.length;
  const diff = newLen - oldLen;
  const newPos = Math.max(0, cursorPos + diff);
  this.setSelectionRange(newPos, newPos);
});

["inputRate","inputQuote","inputMargin"].forEach(id => {
  document.getElementById(id).addEventListener("input", recalculate);
});

document.addEventListener("DOMContentLoaded", recalculate);
</script>
</body>
</html>
