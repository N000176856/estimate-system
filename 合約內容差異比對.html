<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>合約內容差異比對</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.1.0/diff.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  color: #1f2937;
  min-height: 100vh;
  padding: 32px 20px;
  background: #ffffff;
  background-attachment: fixed;
}
.container { max-width: 1400px; margin: 0 auto; }
header { text-align: center; margin-bottom: 28px; }
header h1 {
  font-size: 32px; font-weight: 700; letter-spacing: 0.5px;
  background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* Glassmorphism card */
.card {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(15,23,42,0.04), 0 1px 3px rgba(15,23,42,0.06);
}

.upload-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 720px) { .upload-row { grid-template-columns: 1fr; } }

.drop-zone {
  border: 2px dashed rgba(165,180,252,0.4);
  border-radius: 14px;
  padding: 28px 18px;
  text-align: center;
  cursor: pointer;
  background: rgba(255,255,255,0.03);
  transition: all 0.2s ease;
  min-height: 140px;
  display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px;
}
.drop-zone:hover { border-color: rgba(165,180,252,0.8); background: rgba(99,102,241,0.08); }
.drop-zone.dragover {
  border-color: #a5b4fc; background: rgba(99,102,241,0.18);
  transform: scale(1.02);
}
.drop-zone .icon { font-size: 34px; }
.drop-zone .title { font-weight: 600; font-size: 15px; color: #e0e7ff; }
.drop-zone .hint { font-size: 12px; color: #94a3b8; }
.drop-zone.has-file { border-style: solid; border-color: rgba(34,197,94,0.5); background: rgba(34,197,94,0.08); }
.drop-zone.has-file .icon { color: #4ade80; }
input[type=file] { display: none; }

.controls { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; margin-top: 16px; }
.control { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #cbd5e1; }
.control select {
  padding: 6px 10px; border-radius: 8px;
  background: rgba(15,23,42,0.6); color: #e5e7eb;
  border: 1px solid rgba(255,255,255,0.15); font-size: 14px;
}
.control input[type=checkbox] { accent-color: #818cf8; width: 15px; height: 15px; }

.btn {
  padding: 10px 22px; border: none; border-radius: 10px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white; font-weight: 600; font-size: 14px; cursor: pointer;
  box-shadow: 0 4px 14px rgba(99,102,241,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.55); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.secondary { background: rgba(255,255,255,0.08); box-shadow: none; border: 1px solid rgba(255,255,255,0.15); }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 720px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.stat {
  background: #ffffff; padding: 20px 16px; border-radius: 14px; text-align: center;
  border: 1px solid rgba(255,255,255,0.6);
  box-shadow: 0 6px 24px rgba(0,0,0,0.18);
}
.stat .num { font-size: 32px; font-weight: 700; line-height: 1.1; }
.stat .label { font-size: 13px; color: #64748b; margin-top: 6px; }
.stat.add .num { color: #16a34a; }
.stat.del .num { color: #dc2626; }
.stat.mod .num { color: #d97706; }
.stat.eq .num { color: #64748b; }
.stat.sim .num { color: #4f46e5; }

.tabs { display: flex; gap: 6px; margin-bottom: 0; }
.tab {
  padding: 10px 20px; background: transparent; border: none; color: #94a3b8; cursor: pointer;
  font-size: 14px; border-bottom: 2px solid transparent; transition: all .2s;
}
.tab:hover { color: #e0e7ff; }
.tab.active { color: #ffffff; border-bottom-color: #818cf8; font-weight: 600; }

/* 淺色內區 — 上一版的風格 */
.diff-container {
  max-height: 620px; overflow: auto;
  border-radius: 12px;
  background: #ffffff;
  border: 1px solid #e5e7eb;
  box-shadow: 0 6px 24px rgba(0,0,0,0.18);
  padding: 0;
}
.diff-container::-webkit-scrollbar { width: 10px; height: 10px; }
.diff-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }
.diff-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

.side-by-side { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.sbs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; align-items: start; padding: 12px; background: #ffffff; border-radius: 12px; }
.sbs-head { position: sticky; top: 0; background: #f8fafc; padding: 8px 12px; font-weight: 600; color: #475569; border-bottom: 1px solid #e2e8f0; z-index: 5; border-radius: 4px; }
.sbs-grid .para { margin: 0; }
.sbs-grid .para.empty { min-height: 40px; background: repeating-linear-gradient(45deg, transparent, transparent 6px, rgba(148,163,184,0.08) 6px, rgba(148,163,184,0.08) 12px); border: 1px dashed rgba(148,163,184,0.3); border-radius: 6px; }
.side-col { padding: 12px 16px; }
.side-col:first-child { border-right: 1px solid #e5e7eb; }
.side-col h4 {
  font-size: 13px; color: #475569; margin-bottom: 10px;
  position: sticky; top: 0; background: #ffffff; padding: 8px 0;
  border-bottom: 1px solid #e5e7eb; z-index: 2; font-weight: 600;
}

/* 段落行——上一版的淺色底 */
.para {
  padding: 10px 12px; margin: 6px 0; border-radius: 6px; line-height: 1.7;
  font-size: 14px; color: #1f2937; white-space: pre-wrap; word-break: break-word;
}
.para.equal { background: transparent; color: #374151; }
.para.add { background: #dcfce7; color: #14532d; }
.para.del { background: #fee2e2; color: #7f1d1d; }
.para.mod { background: #fef3c7; color: #78350f; }
.para.inline { background: #ffffff; color: #1f2937; padding: 16px 20px; }
.para.empty { background: transparent; min-height: 20px; }

/* 行內細部 diff */
.para ins {
  background: #86efac; color: #14532d; text-decoration: none;
  padding: 1px 3px; border-radius: 3px; font-weight: 600;
}
.para del {
  background: #fca5a5; color: #7f1d1d; text-decoration: none;
  padding: 1px 3px; border-radius: 3px; font-weight: 600;
}

/* 合併 diff 模式 */
.unified { padding: 12px 16px; }
.unified .line {
  padding: 6px 10px; margin: 2px 0; border-radius: 4px; line-height: 1.6;
  font-size: 14px; white-space: pre-wrap; word-break: break-word;
  font-family: "Menlo", Consolas, monospace;
}
.unified .line.add { background: #dcfce7; color: #14532d; }
.unified .line.del { background: #fee2e2; color: #7f1d1d; }
.unified .line.equal { color: #475569; }

.status { text-align: center; padding: 20px; color: #94a3b8; font-size: 14px; }
.progress-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-top: 10px; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #ec4899); width: 0%; transition: width 0.3s; }

/* ========== 白色主題覆寫 ========== */
.upload-row { color: #1f2937; }
.drop-zone {
  background: #f5efe1; border: 2px dashed #c9b892; color: #6b5b3f;
  border-radius: 12px; padding: 20px; text-align: center; cursor: pointer;
  transition: all 0.2s;
}
.drop-zone:hover { background: #ede3ce; border-color: #a68f5b; }
.drop-zone.dragover { background: #e8dcbf; border-color: #a68f5b; transform: scale(1.01); }
.drop-zone.has-file { background: #f5efe1; border-color: #a68f5b; border-style: solid; color: #111827; }
.drop-zone.has-file .icon { color: #6b5b3f; }
.drop-zone.has-file .title { color: #111827; font-weight: 700; font-size: 16px; }
.drop-zone.has-file .hint  { color: #1f2937; font-weight: 600; font-size: 13px; }
.drop-zone .file-name { font-weight: 700; margin-top: 6px; color: #111827; font-size: 15px; }
.drop-zone { position: relative; }
.remove-btn {
  position: absolute; top: 8px; right: 8px;
  width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid #a68f5b; background: #ffffff; color: #6b5b3f;
  font-size: 16px; line-height: 1; cursor: pointer;
  display: none; align-items: center; justify-content: center;
  padding: 0; transition: all 0.15s;
  z-index: 2;
}
.remove-btn:hover { background: #b91c1c; color: #ffffff; border-color: #b91c1c; transform: scale(1.08); }
.drop-zone.has-file .remove-btn { display: inline-flex; }
.drop-zone .file-meta { font-size: 12px; color: #374151; margin-top: 2px; }

.controls, .controls label, .controls select, .controls input[type="checkbox"] { color: #1f2937; }
.controls select { background: #ffffff; border: 1px solid #d1d5db; color: #1f2937; padding: 6px 10px; border-radius: 8px; }
.controls select:hover { border-color: #94a3b8; }

.stat { background: #ffffff; border: 1px solid #e5e7eb; padding: 20px 16px; border-radius: 12px; text-align: center; box-shadow: 0 1px 3px rgba(15,23,42,0.04); }
.stat .num { font-size: 32px; font-weight: 700; }
.stat .label { font-size: 13px; color: #64748b; margin-top: 4px; }
.stat.add .num { color: #16a34a; }
.stat.del .num { color: #dc2626; }
.stat.mod .num { color: #d97706; }
.stat.eq .num { color: #475569; }
.stat.sim .num { color: #4f46e5; }

.tabs { border-bottom: 1px solid #e5e7eb; margin-bottom: 14px; }
.tab { background: transparent; border: none; padding: 8px 16px; font-size: 14px; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: #1e293b; }
.tab.active { color: #4f46e5; border-bottom-color: #4f46e5; font-weight: 600; }

.side-col h4 { color: #475569; background: #f8fafc; border-bottom: 1px solid #e5e7eb; margin: 0; padding: 8px 12px; font-size: 13px; font-weight: 600; position: sticky; top: 0; z-index: 2; }
.side-col { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }

.para { padding: 10px 12px; line-height: 1.7; border-radius: 0; margin: 0; border-bottom: 1px solid #f1f5f9; color: #1f2937; }
.para.equal { background: #ffffff; }
.para.add { background: #dcfce7; }
.para.del { background: #fee2e2; }
.para.mod { background: #fef3c7; color: #78350f; }
.para.inline { background: #ffffff; }
.para.empty { background: repeating-linear-gradient(45deg, #f8fafc, #f8fafc 6px, #eef2f6 6px, #eef2f6 12px); border: 1px dashed #cbd5e1; min-height: 40px; }

ins { background: #86efac; color: #14532d; text-decoration: none; padding: 1px 3px; border-radius: 3px; font-weight: 600; }
del { background: #fca5a5; color: #7f1d1d; text-decoration: none; padding: 1px 3px; border-radius: 3px; font-weight: 600; }

.status { color: #475569; }
.warn { background: #fef3c7; border: 1px solid #fde68a; color: #78350f; padding: 10px 14px; border-radius: 8px; margin-top: 10px; font-size: 13px; }

.progress-bar { background: #e5e7eb; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 8px; }

button.primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); box-shadow: 0 2px 8px rgba(99,102,241,0.25); }
button.primary:hover { box-shadow: 0 4px 14px rgba(99,102,241,0.35); transform: translateY(-1px); }

/* 浮水印 */
.watermark {
  position: fixed; bottom: 8px; right: 12px;
  font-size: 11px; color: rgba(100,116,139,0.5);
  font-weight: 400; letter-spacing: 0.3px;
  pointer-events: none; user-select: none; z-index: 100;
}
</style>
</head>
</html>
<body>
<div class="container">
<header>
<h1>合約內容差異比對</h1>
</header>
<div class="card">
<div class="upload-row">
<label class="drop-zone" for="fileA" id="dropA">
<div class="icon">📄</div>
<div class="title" id="labelA">檔案 A</div>
<div class="hint" id="hintA">點選選擇或拖曳至此<br/>支援 .doc / .docx / .pdf</div>
<input accept=".doc,.docx,.pdf" id="fileA" type="file"/>
<button type="button" class="remove-btn" id="removeA" title="移除檔案" aria-label="移除檔案 A">✕</button>
</label>
<label class="drop-zone" for="fileB" id="dropB">
<div class="icon">📄</div>
<div class="title" id="labelB">檔案 B</div>
<div class="hint" id="hintB">點選選擇或拖曳至此<br/>支援 .doc / .docx / .pdf</div>
<input accept=".doc,.docx,.pdf" id="fileB" type="file"/>
<button type="button" class="remove-btn" id="removeB" title="移除檔案" aria-label="移除檔案 B">✕</button>
</label>
</div>
<div class="controls">
<div class="control"><label>比對粒度：</label>
<select id="granularity">
<option selected="" value="paragraph">段落（推薦）</option>
<option value="line">逐行</option>
<option value="word">逐詞</option>
<option value="char">逐字</option>
</select>
</div>
<div class="control"><input checked="" id="ignoreWs" type="checkbox"/><label for="ignoreWs">忽略前後空白</label></div>
<div class="control"><input id="ignoreCase" type="checkbox"/><label for="ignoreCase">忽略大小寫</label></div>
<div class="control"><input id="onlyDiff" type="checkbox"/><label for="onlyDiff">僅顯示差異</label></div>
<div class="control"><label>OCR 語言：</label>
<select id="ocrLang">
<option selected="" value="chi_tra+eng">繁體中文 + 英文</option>
<option value="chi_sim+eng">簡體中文 + 英文</option>
<option value="eng">純英文</option>
<option value="chi_tra">純繁體中文</option>
</select>
</div>
<div class="control"><input id="forceOcr" type="checkbox"/><label for="forceOcr">強制 OCR（PDF）</label></div>
<button class="btn" disabled="" id="compareBtn">開始比對</button>
</div>
<div id="warnings"></div>
<div class="progress-bar" id="progressBar" style="display:none"><div class="progress-bar-fill" id="progressFill"></div></div>
</div>
<div class="card" id="resultCard" style="display:none">
<div class="stats">
<div class="stat add"><div class="num" id="stAdd">0</div><div class="label">新增</div></div>
<div class="stat del"><div class="num" id="stDel">0</div><div class="label">刪除</div></div>
<div class="stat eq"><div class="num" id="stEq">0</div><div class="label">未變更</div></div>
<div class="stat sim"><div class="num" id="stSim">0%</div><div class="label">相似度</div></div>
</div>
</div>
<div class="card" id="diffCard" style="display:none">
<div class="tabs">
<button class="tab active" data-view="side">並排雙欄</button>
<button class="tab" data-view="unified">合併 diff</button>
</div>
<div class="diff-container" id="diffContainer"></div>
</div>
<div class="status" id="status"></div>
</div>
<div class="watermark">林家弘 製作</div>
</body>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let textA = null, textB = null;
let fileAName = "", fileBName = "";
const $ = id => document.getElementById(id);

function setStatus(msg) { $("status").textContent = msg || ""; }
function setProgress(pct) {
  const bar = $("progressBar"), fill = $("progressFill");
  if (pct == null) { bar.style.display = "none"; return; }
  bar.style.display = "block";
  fill.style.width = pct + "%";
}
function addWarn(msg) {
  const div = document.createElement("div");
  div.className = "warn"; div.textContent = msg;
  $("warnings").appendChild(div);
}
function clearWarnings() { $("warnings").innerHTML = ""; }

async function readDocx(file) {
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer: buf });
  return result.value;
}

async function readDoc(file) {
  const buf = await file.arrayBuffer();
  const u8 = new Uint8Array(buf);
  // Heuristic: scan for UTF-16LE readable runs
  let out = [];
  let run = [];
  for (let i = 0; i < u8.length - 1; i += 2) {
    const code = u8[i] | (u8[i+1] << 8);
    // Keep CJK, ASCII printable, common punctuation, newlines
    const isCJK = (code >= 0x4E00 && code <= 0x9FFF) || (code >= 0x3000 && code <= 0x303F) || (code >= 0xFF00 && code <= 0xFFEF);
    const isAscii = code >= 0x20 && code <= 0x7E;
    const isNL = code === 0x0A || code === 0x0D || code === 0x0B;
    if (isCJK || isAscii || isNL) {
      run.push(code);
    } else {
      if (run.length >= 4) {
        let s = String.fromCharCode(...run);
        // Filter out field code garbage
        s = s.replace(/HYPERLINK|PAGEREF|TOC\s+\\o|\\f\s+"[^"]*"|MERGEFORMAT/gi, " ");
        out.push(s);
      }
      run = [];
    }
  }
  if (run.length >= 4) out.push(String.fromCharCode(...run));
  let text = out.join("\n");
  text = text.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");
  text = text.replace(/\n{3,}/g, "\n\n");
  return text;
}

async function readPdf(file, forceOcr, ocrLang) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let allText = "";
  let totalChars = 0;
  const pageTexts = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const pageText = content.items.map(it => it.str).join(" ");
    pageTexts.push({ page, text: pageText });
    totalChars += pageText.trim().length;
    setStatus(`正在讀取 PDF... ${i}/${pdf.numPages}`);
  }
  const avgPerPage = totalChars / pdf.numPages;
  const needOcr = forceOcr || avgPerPage < 20;
  if (needOcr) {
    setStatus("偵測到掃描型 PDF，啟動 OCR（首次需下載語言檔，請稍候）...");
    const worker = await Tesseract.createWorker(ocrLang, 1, {
      logger: m => { if (m.status === "recognizing text") setProgress(m.progress * 100); }
    });
    let ocrText = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: 2.0 });
      const canvas = document.createElement("canvas");
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
      setStatus(`OCR 辨識中... ${i}/${pdf.numPages}`);
      const { data } = await worker.recognize(canvas);
      ocrText += data.text + "\n\n";
    }
    await worker.terminate();
    setProgress(null);
    return ocrText;
  } else {
    return pageTexts.map(p => p.text).join("\n\n");
  }
}

async function processFile(file, forceOcr, ocrLang) {
  const name = file.name.toLowerCase();
  if (name.endsWith(".docx")) return await readDocx(file);
  if (name.endsWith(".doc")) {
    const text = await readDoc(file);
    if (!text || text.replace(/\s/g, "").length < 20) {
      throw new Error(".doc 檔案無法抽取到有效文字，請在 Word 另存為 .docx 或 .pdf 後重試");
    }
    return text;
  }
  if (name.endsWith(".pdf")) return await readPdf(file, forceOcr, ocrLang);
  throw new Error("不支援的檔案格式：" + file.name);
}

// ---- File selection & drag-drop handling ----
function acceptFile(file) {
  const n = file.name.toLowerCase();
  return n.endsWith(".doc") || n.endsWith(".docx") || n.endsWith(".pdf");
}

function handleFileSelected(which, file) {
  if (!file) return;
  if (!acceptFile(file)) {
    alert("不支援的檔案格式：" + file.name + "\n僅支援 .doc / .docx / .pdf");
    return;
  }
  const drop = $("drop" + which);
  const label = $("label" + which);
  const hint = $("hint" + which);
  drop.classList.add("has-file");
  label.textContent = file.name;
  const sizeKB = (file.size / 1024).toFixed(1);
  hint.textContent = `${sizeKB} KB · 點擊可重新選擇`;
  if (which === "A") { fileAObj = file; fileAName = file.name; }
  else { fileBObj = file; fileBName = file.name; }
  checkReady();
}

let fileAObj = null, fileBObj = null;

function checkReady() {
  $("compareBtn").disabled = !(fileAObj && fileBObj);
}

function removeFile(which) {
  const drop  = document.getElementById("drop"  + which);
  const title = document.getElementById("title" + which);
  const hint  = document.getElementById("hint"  + which);
  const input = document.getElementById("file"  + which);
  drop.classList.remove("has-file");
  title.textContent = which === "A" ? "檔案 A" : "檔案 B";
  hint.innerHTML = "點選選擇或拖曳至此<br/>支援 .doc / .docx / .pdf";
  if (input) input.value = "";
  if (which === "A") { fileAObj = null; textA = null; fileAName = ""; }
  else               { fileBObj = null; textB = null; fileBName = ""; }
  checkReady();
}
["A","B"].forEach(w => {
  const btn = document.getElementById("remove" + w);
  if (!btn) return;
  btn.addEventListener("click", e => {
    e.preventDefault();
    e.stopPropagation();
    removeFile(w);
  });
});

// Bind input change
["A", "B"].forEach(which => {
  $("file" + which).addEventListener("change", e => {
    handleFileSelected(which, e.target.files[0]);
  });

  const drop = $("drop" + which);
  // Prevent default browser behavior for drag events
  ["dragenter", "dragover", "dragleave", "drop"].forEach(ev => {
    drop.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); });
  });
  drop.addEventListener("dragenter", () => drop.classList.add("dragover"));
  drop.addEventListener("dragover", () => drop.classList.add("dragover"));
  drop.addEventListener("dragleave", e => {
    // Only remove if actually leaving the drop zone
    if (!drop.contains(e.relatedTarget)) drop.classList.remove("dragover");
  });
  drop.addEventListener("drop", e => {
    drop.classList.remove("dragover");
    const files = e.dataTransfer.files;
    if (files && files.length > 0) {
      handleFileSelected(which, files[0]);
    }
  });
});

// Prevent whole-window drop from opening the file
["dragover", "drop"].forEach(ev => {
  window.addEventListener(ev, e => { e.preventDefault(); });
});
</script>

<script>
function textToParagraphs(text) {
  const ignoreWs = $("ignoreWs").checked;
  const ignoreCase = $("ignoreCase").checked;
  const paras = text.split(/\n+/).map(s => s.replace(/\s+/g, " ")).map(s => ignoreWs ? s.trim() : s).filter(s => s.length > 0);
  return paras.map(orig => ({
    orig,
    key: ignoreCase ? orig.toLowerCase() : orig
  }));
}

// LCS 對齊：回傳 rows = [{type: equal|add|del|mod, a, b}]
function alignParagraphs(paraA, paraB) {
  const n = paraA.length, m = paraB.length;
  // 第一階段：LCS 取得完全相同（key===）的錯點對
  const dp = Array.from({length: n+1}, () => new Int32Array(m+1));
  for (let i = 1; i <= n; i++) {
    for (let j = 1; j <= m; j++) {
      if (paraA[i-1].key === paraB[j-1].key) dp[i][j] = dp[i-1][j-1] + 1;
      else dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  // 回溯錯點對
  const anchors = [];
  let i = n, j = m;
  while (i > 0 && j > 0) {
    if (paraA[i-1].key === paraB[j-1].key) { anchors.push([i-1, j-1]); i--; j--; }
    else if (dp[i-1][j] >= dp[i][j-1]) i--;
    else j--;
  }
  anchors.reverse();
  // 在錯點間施行保序對齊：只對“相對位置接近且相似度高”的段落強配為 mod，其餘就 del/add。
  // 這樣不會因錯位而匯遠方。
  const rows = [];
  let pi = 0, pj = 0;
  function flushSegment(iEnd, jEnd) {
    // paraA[pi..iEnd) vs paraB[pj..jEnd)
    const aSeg = [], bSeg = [];
    for (let x = pi; x < iEnd; x++) aSeg.push(x);
    for (let y = pj; y < jEnd; y++) bSeg.push(y);
    // 双指針對齊：同時前進，不相似就各自列 del/add，相似就 mod
    let a = 0, b = 0;
    while (a < aSeg.length && b < bSeg.length) {
      const A = paraA[aSeg[a]].orig, B = paraB[bSeg[b]].orig;
      const s = similarity(paraA[aSeg[a]].key, paraB[bSeg[b]].key);
      if (s >= 0.5) {
        rows.push({ type: "mod", a: A, b: B });
        a++; b++;
      } else {
        // 斷一下：下一個 B 是否與現在 A 相似？若是→現在 B 是新增
        const sNextB = b+1 < bSeg.length ? similarity(paraA[aSeg[a]].key, paraB[bSeg[b+1]].key) : 0;
        const sNextA = a+1 < aSeg.length ? similarity(paraA[aSeg[a+1]].key, paraB[bSeg[b]].key) : 0;
        if (sNextB >= 0.5 && sNextB > sNextA) {
          rows.push({ type: "add", a: null, b: B });
          b++;
        } else if (sNextA >= 0.5) {
          rows.push({ type: "del", a: A, b: null });
          a++;
        } else {
          // 兩邊都不相似，同時前進，兩邊對齊顯示“各自不同”
          rows.push({ type: "del", a: A, b: null });
          rows.push({ type: "add", a: null, b: B });
          a++; b++;
        }
      }
    }
    while (a < aSeg.length) { rows.push({ type: "del", a: paraA[aSeg[a]].orig, b: null }); a++; }
    while (b < bSeg.length) { rows.push({ type: "add", a: null, b: paraB[bSeg[b]].orig }); b++; }
  }
  for (const [ai, bi] of anchors) {
    flushSegment(ai, bi);
    rows.push({ type: "equal", a: paraA[ai].orig, b: paraB[bi].orig });
    pi = ai + 1; pj = bi + 1;
  }
  flushSegment(n, m);
  return rows;
}

function similarity(a, b) {
  if (!a || !b) return 0;
  const la = a.length, lb = b.length;
  if (la === 0 && lb === 0) return 1;
  const parts = Diff.diffChars(a, b);
  let same = 0;
  parts.forEach(p => { if (!p.added && !p.removed) same += p.value.length; });
  return same / Math.max(la, lb);
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function inlineDiff(a, b, granularity) {
  let parts;
  if (granularity === "word") parts = Diff.diffWords(a, b);
  else parts = Diff.diffChars(a, b);
  const aParts = [], bParts = [];
  parts.forEach(p => {
    const v = escapeHtml(p.value);
    if (p.added) bParts.push(`<ins>${v}</ins>`);
    else if (p.removed) aParts.push(`<del>${v}</del>`);
    else { aParts.push(v); bParts.push(v); }
  });
  return { aHtml: aParts.join(""), bHtml: bParts.join("") };
}
</script>

<script>
let lastRows = null;
let lastGran = "paragraph";
let lastTextA = "", lastTextB = "";

$("compareBtn").addEventListener("click", async () => {
  try {
    $("compareBtn").disabled = true;
    clearWarnings();
    setStatus("讀取檔案 A...");
    const forceOcr = $("forceOcr").checked;
    const ocrLang = $("ocrLang").value;
    textA = await processFile(fileAObj, forceOcr, ocrLang);
    if (fileAName.toLowerCase().endsWith(".doc")) {
      addWarn(".doc 旧格式採啟發式抽取，複雜排版可能失真；若結果異常請在 Word 另存為 .docx 後重試");
    }
    setStatus("讀取檔案 B...");
    textB = await processFile(fileBObj, forceOcr, ocrLang);
    if (fileBName.toLowerCase().endsWith(".doc") && !fileAName.toLowerCase().endsWith(".doc")) {
      addWarn(".doc 旧格式採啟發式抽取，複雜排版可能失真");
    }
    setStatus("比對中...");
    lastTextA = textA; lastTextB = textB;
    runCompare();
    setStatus("完成");
  } catch (err) {
    console.error(err);
    addWarn("錯誤：" + err.message);
    setStatus("");
  } finally {
    $("compareBtn").disabled = false;
    setProgress(null);
  }
});

// 粒度、選項變更 → 重新渲染
["granularity", "ignoreWs", "ignoreCase", "onlyDiff"].forEach(id => {
  $(id).addEventListener("change", () => {
    if (lastTextA && lastTextB) runCompare();
  });
});

function runCompare() {
  const gran = $("granularity").value;
  lastGran = gran;
  if (gran === "paragraph") {
    const pa = textToParagraphs(lastTextA);
    const pb = textToParagraphs(lastTextB);
    const rows = alignParagraphs(pa, pb);
    lastRows = rows;
    renderStatsParagraph(rows);
    renderSideBySide(rows);
    renderUnified(rows);
  } else {
    // 逐行 / 逐詞 / 逐字
    let parts;
    let a = lastTextA, b = lastTextB;
    if ($("ignoreCase").checked) { a = a.toLowerCase(); b = b.toLowerCase(); }
    if (gran === "line") parts = Diff.diffLines(a, b, { ignoreWhitespace: $("ignoreWs").checked });
    else if (gran === "word") parts = Diff.diffWords(a, b);
    else parts = Diff.diffChars(a, b);
    lastRows = parts;
    renderStatsRaw(parts);
    renderSideBySideRaw(parts);
    renderUnifiedRaw(parts);
  }
  $("resultCard").style.display = "block";
  $("diffCard").style.display = "block";
}

function renderStatsParagraph(rows) {
  // 以字元級 LCS 統計，不受粒度影響
  const parts = Diff.diffChars(lastTextA || "", lastTextB || "");
  let add = 0, del = 0, eq = 0;
  parts.forEach(p => {
    const n = p.value.length;
    if (p.added) add += n;
    else if (p.removed) del += n;
    else eq += n;
  });
  const total = add + del + eq;
  const sim = total === 0 ? 0 : Math.round((eq * 2 / (add + del + eq * 2)) * 100);
  $("stAdd").textContent = add.toLocaleString();
  $("stDel").textContent = del.toLocaleString();
  if($("stMod")) $("stMod").textContent = "-";
  $("stEq").textContent = eq.toLocaleString();
  $("stSim").textContent = sim + "%";
}
function renderStatsRaw(parts) {
  let add=0, del=0, eq=0;
  parts.forEach(p => {
    const n = p.count || (p.value ? p.value.length : 0);
    if (p.added) add += n;
    else if (p.removed) del += n;
    else eq += n;
  });
  const total = add + del + eq;
  const sim = total===0 ? 0 : Math.round((eq*2 / (add + del + eq*2)) * 100);
  $("stAdd").textContent = add.toLocaleString();
  $("stDel").textContent = del.toLocaleString();
  if($("stMod")) $("stMod").textContent = "-";
  $("stEq").textContent = eq.toLocaleString();
  $("stSim").textContent = sim + "%";
}

function renderSideBySide(rows) {
  const onlyDiff = $("onlyDiff").checked;
  const html = [];
  html.push('<div class="side-by-side">');
  html.push('<div class="side-col"><h4>檔案 A</h4>');
  rows.forEach(r => {
    if (onlyDiff && r.type === "equal") return;
    if (r.type === "equal") html.push(`<div class="para equal">${escapeHtml(r.a)}</div>`);
    else if (r.type === "del") html.push(`<div class="para del">${escapeHtml(r.a)}</div>`);
    else if (r.type === "add") html.push(`<div class="para empty"></div>`);
    else if (r.type === "mod") {
      const d = inlineDiff(r.a, r.b, "char");
      html.push(`<div class="para mod">${d.aHtml}</div>`);
    }
  });
  html.push('</div><div class="side-col"><h4>檔案 B</h4>');
  rows.forEach(r => {
    if (onlyDiff && r.type === "equal") return;
    if (r.type === "equal") html.push(`<div class="para equal">${escapeHtml(r.b)}</div>`);
    else if (r.type === "add") html.push(`<div class="para add">${escapeHtml(r.b)}</div>`);
    else if (r.type === "del") html.push(`<div class="para empty"></div>`);
    else if (r.type === "mod") {
      const d = inlineDiff(r.a, r.b, "char");
      html.push(`<div class="para mod">${d.bHtml}</div>`);
    }
  });
  html.push('</div></div>');
  $("diffContainer").innerHTML = html.join("");
  $("diffContainer").dataset.view = "side";
}

function renderUnified(rows) {
  const onlyDiff = $("onlyDiff").checked;
  const html = ['<div class="unified">'];
  rows.forEach(r => {
    if (onlyDiff && r.type === "equal") return;
    if (r.type === "equal") html.push(`<div class="line equal">  ${escapeHtml(r.a)}</div>`);
    else if (r.type === "del") html.push(`<div class="line del">- ${escapeHtml(r.a)}</div>`);
    else if (r.type === "add") html.push(`<div class="line add">+ ${escapeHtml(r.b)}</div>`);
    else if (r.type === "mod") {
      html.push(`<div class="line del">- ${escapeHtml(r.a)}</div>`);
      html.push(`<div class="line add">+ ${escapeHtml(r.b)}</div>`);
    }
  });
  html.push('</div>');
  window._unifiedHtml = html.join("");
}

function renderSideBySideRaw(parts) {
  // 把所有 parts 拼成 A/B 兩欄 HTML，只有 added/removed 部分標色，其餘保持原色
  let aHtml = "", bHtml = "";
  parts.forEach(p => {
    const v = escapeHtml(p.value);
    if (p.added) {
      bHtml += `<ins>${v}</ins>`;
    } else if (p.removed) {
      aHtml += `<del>${v}</del>`;
    } else {
      aHtml += v;
      bHtml += v;
    }
  });
  const html = ['<div class="side-by-side">'];
  html.push(`<div class="side-col"><h4>檔案 A</h4><div class="para inline">${aHtml}</div></div>`);
  html.push(`<div class="side-col"><h4>檔案 B</h4><div class="para inline">${bHtml}</div></div>`);
  html.push('</div>');
  $("diffContainer").innerHTML = html.join("");
}

function renderUnifiedRaw(parts) {
  // 把 diff parts 拼成一區，內部行內標色（邏輯同 side-by-side）
  let combined = "";
  parts.forEach(p => {
    const v = escapeHtml(p.value);
    if (p.added) combined += `<ins>${v}</ins>`;
    else if (p.removed) combined += `<del>${v}</del>`;
    else combined += v;
  });
  window._unifiedHtml = `<div class="unified"><div class="para inline">${combined}</div></div>`;
}

// Tab switching
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    const view = tab.dataset.view;
    if (!lastRows) return;
    if (view === "side") {
      if (lastGran === "paragraph") renderSideBySide(lastRows);
      else renderSideBySideRaw(lastRows);
    } else {
      $("diffContainer").innerHTML = window._unifiedHtml || "";
    }
  });
});
</script>
